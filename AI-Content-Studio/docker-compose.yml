version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai_content_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: ai_content_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=ai-system-3.0-secure-key
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - ./workflows:/home/node/.n8n
      - ./exports:/data/exports
    restart: unless-stopped
